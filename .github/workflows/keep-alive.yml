# Empêche la pause automatique de Supabase (free tier) et maintient
# le repo GitHub actif pour que les scheduled workflows ne soient pas désactivés.
# Exécute un simple health-check toutes les 72 h.

name: Keep Alive

on:
  schedule:
    # Tous les 3 jours à 06:00 UTC
    - cron: "0 6 */3 * *"
  workflow_dispatch: # permet de le lancer manuellement

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase
        run: |
          # Simple requête pour garder le projet Supabase actif
          if [ -n "$SUPABASE_URL" ]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "${SUPABASE_URL}/rest/v1/" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
            echo "Supabase ping: HTTP $STATUS"
          else
            echo "SUPABASE_URL not set, skipping"
          fi
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Ping Production Site
        run: |
          if [ -n "$SITE_URL" ]; then
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL")
            echo "Site ping: HTTP $STATUS"
          else
            echo "SITE_URL not set, skipping"
          fi
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
